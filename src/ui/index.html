<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none';" />
  <title>APY Dog</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="titlebar">
      <div class="brand"><span class="mark">🐕</span><span class="name">APY Dog</span><span class="ver" id="ver"></span></div>


      <div class="search">
        <span style="color:var(--text-faint)">⌕</span>
        <input id="q-text" type="text" placeholder="Search name, ticker, protocol…" spellcheck="false" autocomplete="off" />
        <span class="hint" id="search-hint">⌘K</span>
      </div>

      <span class="spacer"></span>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-view="radar">Radar</button>
        <button class="tab" data-view="find">Browse</button>
        <button class="tab" data-view="signals" title="What is showing the conditions that precede a large move">Signals</button>
        <button class="tab" data-view="plan">Plan</button>
        <button class="tab" data-view="events">Calendar <span class="count" id="ev-count">0</span></button>
        <button class="tab" data-view="watch">Watchlist <span class="count" id="watch-count">0</span></button>
        <button class="tab" data-view="sources">Sources <span class="count" id="src-count">–</span></button>
        <button class="tab" data-view="learn" title="Plain-English explanations of every term in the app">Learn</button>
        <button class="tab" data-view="settings">Settings</button>
      </nav>

      <span class="livedot" id="livedot" title="Live updating"><i></i><span id="live-label">live</span></span>
      <button class="btn ghost icon" id="btn-theme" title="Toggle theme">◐</button>
      <button class="btn ghost" id="btn-export" title="Export current results">Export</button>
      <button class="btn primary" id="btn-refresh"><span id="refresh-label">Refresh</span></button>
    </header>

    <div class="notice hidden" id="notice">
      <span id="notice-text"></span>
      <span class="spacer"></span>
      <button class="btn sm" id="notice-action"></button>
      <button class="btn ghost sm" id="notice-close">✕</button>
    </div>

    <div class="main">
      <div class="radar" id="view-radar"></div>

      <div class="content" id="view-find">
        <div class="filterbar">
          <div class="sectionswitch" id="trackswitch">
            <button data-section="income" title="Things that pay a rate you can compute">
              <span class="ic">◆</span>Income <span class="n" id="n-income"></span>
            </button>
            <button data-section="movement" title="Things whose return is price — what is about to move, and how hard">
              <span class="ic">◈</span>Movement <span class="n" id="n-movement"></span>
            </button>
            <button data-section="deals" title="Bounded money: bonuses, referrals, promotions">
              <span class="ic">★</span>Deals <span class="n" id="n-deals"></span>
            </button>
            <button data-section="all" class="on">All <span class="n" id="n-all"></span></button>
          </div>
          <span id="filterbar" style="display:contents"></span>
        </div>
        <div class="resbar">
          <span class="amountbox" title="Every dollar figure in the list recomputes on this. Leave it empty to see rates instead.">
            <label for="q-amount">I have</label>
            <span class="amtwrap"><i>$</i><input id="q-amount" type="text" inputmode="numeric" placeholder="any amount" /></span>
            <button class="amtclear" id="q-amount-clear" title="Clear the amount and go back to rates">✕</button>
          </span>
          <span class="desc" id="res-desc"></span>
          <span class="spacer"></span>
          <label style="color:var(--text-faint);font-size:11px">Sort by</label>
          <select id="q-sort"></select>
        </div>
        <div class="tablewrap" id="tablewrap"></div>
      </div>

      <div class="pane" id="view-signals" hidden></div>
      <div class="pane" id="view-plan" hidden></div>
      <div class="pane" id="view-learn" hidden></div>
      <div class="pane" id="view-events" hidden></div>
      <div class="pane" id="view-watch" hidden></div>
      <div class="pane" id="view-sources" hidden></div>
      <div class="pane" id="view-settings" hidden></div>

      <aside class="drawer hidden" id="drawer"></aside>
    </div>
  </div>

  <div class="helppop hidden" id="helppop"></div>
  <div class="fmenu hidden" id="fmenu"></div>
  <div class="fedit hidden" id="fedit"></div>

  <div class="progress hidden" id="progress">
    <span class="spin"></span>
    <div class="bar"><i id="progress-bar" style="width:0%"></i></div>
    <span class="txt" id="progress-text">Starting…</span>
    <button class="btn ghost sm" id="progress-cancel">Cancel</button>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="format.js"></script>
  <script src="filters-def.js"></script>
  <script src="render.js"></script>
  <script src="glossary.js"></script>
    <script src="app.js"></script>
</body>
</html>
